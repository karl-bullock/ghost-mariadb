# MariaDB compatibility harness for Ghost — private mirror of TryGhost/Ghost.
# Runs upstream's acceptance-tests recipe (e2e + integration suites,
# NODE_ENV=testing-mysql, redis + MinIO services) against MariaDB only.
#
# Findings that shaped this (2026-07-03, Ghost v6.50.0):
# - Full suite PASSES on mariadb-11.4 with the knex quoted-defaults patch
#   applied (see .github/scripts/knex-mariadb-defaults-patch.mjs).
# - postgres: permanently unsupported by Ghost ("Database client not
#   supported: pg" from the migration layer) — leg removed as settled.
# - mysql8 control + sqlite legs removed by choice to save minutes; if a
#   future sync goes red, temporarily re-add a mysql:8.0 control leg to tell
#   MariaDB-specific breakage from upstream breakage.
name: MariaDB compatibility

on:
  push:
    branches: [main]
  workflow_dispatch:

# One matrix at a time: a newer push supersedes and CANCELS any in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        db:
          - name: mariadb-10.11
            image: mariadb:10.11
          - name: mariadb-11.4
            image: mariadb:11.4
    name: DB tests (${{ matrix.db.name }})
    services:
      mysql:
        image: ${{ matrix.db.image }}
        env:
          MARIADB_DATABASE: ghost_testing
          MARIADB_ROOT_PASSWORD: root
          MYSQL_DATABASE: ghost_testing
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306
        # mariadb:11 removed the mysql* compat symlinks — use the official
        # healthcheck script (works on 10.11 too). tmpfs keeps the DB in RAM.
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=60
      redis:
        image: redis:7.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=60
    env:
      DB: mysql8
      NODE_ENV: testing-mysql
      NX_NO_CLOUD: 'true'
      # Lets tests branch on genuine MariaDB behavior deltas (see
      # posts.test.js invalid-filter: MySQL errors, MariaDB coerces).
      DB_FLAVOR: mariadb
      database__connection__host: 127.0.0.1
      database__connection__password: root
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        env:
          FORCE_COLOR: 0
        with:
          node-version: '22.18.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply knex MariaDB default-literal fix
        # MariaDB returns quoted COLUMN_DEFAULT literals; unpatched knex 2.4.2
        # corrupts column defaults in setNullable/dropNullable. See the script.
        run: node .github/scripts/knex-mariadb-defaults-patch.mjs

      - name: Set timezone (non-UTC, matches upstream CI)
        uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: "America/New_York"

      - name: Set DB port
        run: echo "database__connection__port=${{ job.services.mysql.ports['3306'] }}" >> "$GITHUB_ENV"

      - name: Report server version
        run: mysql -h 127.0.0.1 -P "$database__connection__port" -uroot -proot -e "SELECT VERSION();"

      - name: E2E tests
        id: e2e
        # Keep going on failure so the integration suite still produces data —
        # the final step re-asserts the job result.
        continue-on-error: true
        run: pnpm nx run ghost:test:e2e

      - name: Start MinIO for integration tests
        run: |
          docker run -d --rm --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minio-user \
            -e MINIO_ROOT_PASSWORD=minio-pass \
            minio/minio:RELEASE.2024-12-13T22-19-12Z \
            server /data
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/ready; then
              echo "MinIO ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become ready in time" >&2
          docker logs minio
          exit 1

      - name: Integration tests
        id: integration
        continue-on-error: true
        run: pnpm nx run ghost:test:integration

      - name: Result
        run: |
          echo "e2e: ${{ steps.e2e.outcome }}"
          echo "integration: ${{ steps.integration.outcome }}"
          if [ "${{ steps.e2e.outcome }}" != "success" ] || [ "${{ steps.integration.outcome }}" != "success" ]; then
            exit 1
          fi

  report:
    # On automated upstream syncs, file the verdict as an issue so new-release
    # compatibility lands in the repo without anyone watching the run.
    needs: db-tests
    if: always() && contains(github.event.head_commit.message, 'Upstream sync:')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - name: File verdict issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SUMMARY=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '.jobs[] | select(.name | startswith("DB tests")) | "- \(.name): **\(.conclusion // .status)**"')
          TAG=$(echo "${{ github.event.head_commit.message }}" | head -1 | sed 's/Upstream sync: Ghost //; s/ (.*//')
          gh issue create -R "${{ github.repository }}" \
            --title "Ghost ${TAG}: MariaDB compatibility verdict" \
            --body "$(printf 'Automated compat run for the upstream sync to **%s**.\n\n%s\n\nRun: %s/actions/runs/%s' "$TAG" "$SUMMARY" "${{ github.server_url }}/${{ github.repository }}" "${{ github.run_id }}")"
